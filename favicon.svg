<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
    <defs>
        <linearGradient id="avatarGradient" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse">
            <stop class="grad-start" offset="0%"/>
            <stop class="grad-end" offset="100%"/>
        </linearGradient>
        <mask id="innerHole">
            <rect x="0" y="0" width="128" height="128" fill="#FFFFFF"/>
            <text x="64" y="62" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="104" fill="#000000" stroke="#000000" stroke-width="6" stroke-linejoin="round">A</text>
        </mask>
        <mask id="outline">
            <text x="64" y="62" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="104" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round">A</text>
            <text x="64" y="62" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="104" fill="#000000" stroke="#000000" stroke-width="6" stroke-linejoin="round">A</text>
        </mask>
    </defs>
    <circle cx="64" cy="64" r="60" fill="url(#avatarGradient)" mask="url(#innerHole)"/>
    <rect x="0" y="0" width="128" height="128" fill="#18181B" mask="url(#outline)"/>
    <style>
        .grad-start { stop-color: #7C3AED; }
        .grad-end { stop-color: #F97316; }
    </style>
</svg>
